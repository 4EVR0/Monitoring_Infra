name: Deploy to monitoring server

# 처음엔 수동 실행으로만 검증한 뒤 main push 트리거를 연다(docs: predeploy_improvement_plan §2 P11).
on:
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC → AWS 역할(장기 키 없음)
  contents: read

concurrency:
  group: deploy-monitoring
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  INSTANCE_ID: i-0eb2cc1e21555abe1   # monitoring-server
  REPO_DIR: /home/monitoring

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::973972497926:role/GitHubActionsSSMRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command via SSM
        id: send
        run: |
          # pull 이전 SHA를 남기고(레포 소유자 권한으로) pull → 새 버전 deploy.sh가 바뀐 파일만 반영
          cat > params.json <<EOF
          {"commands": [
            "set -e",
            "cd ${REPO_DIR}",
            "OWNER=\$(stat -c %U .)",
            "BEFORE=\$(runuser -u \"\$OWNER\" -- git rev-parse HEAD)",
            "runuser -u \"\$OWNER\" -- git pull --ff-only",
            "bash scripts/deploy.sh \"\$BEFORE\""
          ]}
          EOF
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "monitoring deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command: $command_id"

      - name: Wait for result
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          # 'aws ssm wait'은 약 100초 제한이라 직접 폴링(이미지 빌드 대비 최대 15분)
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" > result.json
          echo "::group::stdout"; jq -r .StandardOutputContent result.json; echo "::endgroup::"
          echo "::group::stderr"; jq -r .StandardErrorContent result.json; echo "::endgroup::"
          echo "Status=$(jq -r .Status result.json) ResponseCode=$(jq -r .ResponseCode result.json)"
          test "$(jq -r .Status result.json)" = "Success"
