version: '3'

# 공용 모니터링 스택 (이전 위치: /home/ubuntu/monitoring)
# 소유 그룹: adv  /  데이터는 named volume 으로 영속화됨
services:
  prometheus:
    image: prom/prometheus:v3.11.3          # 태그 고정: latest 자동 업그레이드 방지
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus          # TSDB 영속화
      - ./targets:/etc/prometheus/targets:ro  # file_sd 대상(외부 확인 도메인 등, 실제 파일은 서버에만·gitignore)
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'  # Alloy remote_write 수신
    restart: always

  grafana:
    image: grafana/grafana:13.0.1            # 현재 동작 중인 버전으로 고정
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=kniepdennis-neo4j-datasource,yesoreyeram-infinity-datasource
      - DISCORD_ALERT_WEBHOOK_URL=${DISCORD_ALERT_WEBHOOK_URL}  # 알림 연결처 YAML이 참조. 실제 값은 .env(gitignore)
    volumes:
      - grafana-data:/var/lib/grafana        # 대시보드/데이터소스/계정 영속화 (이전엔 휘발성이었음)
      - ./config/provisioning:/etc/grafana/provisioning  # 알림 룰·연결처 as-code 로딩
    restart: always

  loki:
    image: grafana/loki:3.5.0                 # 멀티아치(arm64 자동), 단일바이너리 모드
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml
      - loki-data:/loki                        # 인덱스/wal/캐시 (청크는 S3로)
    command: -config.file=/etc/loki/config.yml # 인증은 EC2 IAM 롤(MonitoringServerRole)→S3
    restart: always

  dq_api:
    build: ./dq_api                            # 정합성(DQ) 메트릭 조회 API (Iceberg→DuckDB→JSON)
    ports:
      - "8000:8000"                            # Grafana는 compose 망 DNS(http://dq_api:8000)로 접근
    environment:
      # warehouse 경로·리전은 비밀 아님 → compose에 직접. 자격증명은 EC2 IAM 롤(IMDS hop limit=2 필요)
      - ICEBERG_WAREHOUSE_PATH=s3://oliveyoung-crawl-data/olive_young_iceberg_metadata/
      - AWS_REGION=ap-northeast-2
    restart: always
    labels:
      - autoheal=true                          # autoheal이 unhealthy 감지 시 이 컨테이너 재시작
    healthcheck:
      # /health가 캐시를 무시하고 실제 S3 스캔을 하도록 바뀜(force) → TLS 상태 부패를 여전히 잡음.
      # 일반 트래픽은 dq_api 캐시로 견디고, 이 헬스 경로만 실제 S3를 타서 장애 시 재시작을 유도.
      # 장기 구동 시 pyarrow/aws-sdk TLS 컨텍스트가 깨져 S3 접근이 curlCode77로 실패 → 재시작만이 해결.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=10).status==200 else 1)"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  mlflow:
    build: ./mlflow                             # 실험 추적 서버(4EVR0-Server eval/ 결과 기록). mlflow==3.14.0
    ports:
      - "5000:5000"                             # Tailscale로만 접근. 보안 그룹에 5000을 열지 않는다(인증 없음)
    environment:
      - AWS_REGION=ap-northeast-2               # artifact → S3, 인증은 EC2 IAM 롤(MonitoringServerRole)
    volumes:
      - mlflow-data:/mlflow                     # 실험·run 메타데이터(SQLite)
    command:
      - --host=0.0.0.0
      - --port=5000
      - --workers=2
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=s3://4evr0-monitoring/mlflow-artifacts
      - --serve-artifacts                       # 클라이언트는 S3 키 없이 서버를 거쳐 artifact를 올리고 받는다
      # DNS rebinding 방지: tailnet 이름·IP와 서버 내부 확인용만 허용
      - --allowed-hosts=monitoring-server-1.tailb70036.ts.net,monitoring-server-1.tailb70036.ts.net:5000,100.105.250.65,100.105.250.65:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    restart: always

  blackbox:
    image: prom/blackbox-exporter:v0.28.0     # 외부 HTTPS 확인(사용자와 같은 경로로 접속). 호스트 포트 없음
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: always

  autoheal:
    image: willfarrell/autoheal:1.2.0          # unhealthy 컨테이너 자동 재시작 (멀티아치, arm64 OK)
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal      # label=autoheal=true 인 컨테이너만 감시
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # 컨테이너 상태 조회/재시작용 (read-only)
    restart: always

volumes:
  prometheus-data:
  grafana-data:
  mlflow-data:
  loki-data:
